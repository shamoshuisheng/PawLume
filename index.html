<style>
  :root {
    --bg: #0e0c0a;
    --surface: #17130e;
    --surface-2: #221b13;
    --border: #33291d;
    --text: #f4efe7;
    --muted: #a89a86;
    --accent: #C9A87C;
    --accent-2: #E8C98F;
    --accent-grad: linear-gradient(135deg, #7A5C3E 0%, #C9A87C 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Noto Sans JP", "Noto Sans KR", "Helvetica Neue", sans-serif;
    line-height: 1.7;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  /* Language switcher */
  .lang-bar {
    display: flex; justify-content: flex-end; gap: 6px;
    padding: 20px 0 0;
    flex-wrap: wrap;
  }
  .lang-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 7px;
    font-size: 12.5px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .lang-btn:hover { border-color: var(--accent); color: var(--text); }
  .lang-btn.active {
    background: var(--accent-grad);
    color: #fff; border-color: transparent;
    font-weight: 600;
  }

  /* Hero */
  .hero {
    padding: 48px 0 40px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    width: 60px; height: 60px; margin: 0 auto 20px;
    border-radius: 16px;
    background: var(--accent-grad);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(201, 168, 124, 0.30);
  }
  .logo-mark svg { width: 32px; height: 32px; }
  .hero h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
  .hero p { color: var(--muted); font-size: 15px; max-width: 520px; margin: 0 auto; }

  .contact-bar {
    margin: 32px auto 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .contact-bar .label { color: var(--muted); font-size: 13px; }
  .contact-bar .email { font-weight: 600; font-size: 15px; }

  section { padding: 40px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }
  h2 {
    font-size: 19px; font-weight: 700; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::before {
    content: ""; width: 4px; height: 18px; border-radius: 2px;
    background: var(--accent-grad);
  }

  .feat-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .feat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .feat h3 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .feat p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .feat .icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: var(--surface-2); margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .feat .icon svg { width: 16px; height: 16px; stroke: var(--accent-2); fill: none; stroke-width: 2; }

  .faq-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    background: var(--surface);
    overflow: hidden;
  }
  .faq-q {
    padding: 16px 18px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 14.5px;
    user-select: none;
  }
  .faq-q:hover { background: var(--surface-2); }
  .faq-q .arrow {
    transition: transform 0.2s;
    color: var(--muted); font-size: 12px;
    flex-shrink: 0; margin-left: 12px;
  }
  .faq-item.open .faq-q .arrow { transform: rotate(180deg); }
  .faq-a {
    max-height: 0; overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .faq-a-inner {
    padding: 0 18px 16px;
    color: var(--muted); font-size: 14px; line-height: 1.75;
  }
  .faq-item.open .faq-a { max-height: 600px; }
  .faq-a-inner strong { color: var(--text); font-weight: 600; }
  .faq-a-inner a { color: var(--accent-2); }

  .info-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
  }
  .info-block p { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .info-block p:last-child { margin-bottom: 0; }
  .info-block strong { color: var(--text); }

  footer {
    padding: 32px 0 48px;
    text-align: center;
    color: var(--muted); font-size: 12.5px;
  }
  footer .links { margin-bottom: 10px; }
  footer .links a { margin: 0 10px; }

  @media (max-width: 600px) {
    .hero { padding: 32px 0 28px; }
    .hero h1 { font-size: 22px; }
    .feat-grid { grid-template-columns: 1fr; }
    .contact-bar { flex-direction: column; align-items: flex-start; }
    h2 { font-size: 17px; }
    .lang-btn { padding: 4px 8px; font-size: 11.5px; }
  }
</style>

var ICONS = {
  cutout: '<svg viewBox="0 0 24 24"><path d="M12 3l2 6 6 0-4.5 4 1.5 6L12 16l-5 3 1.5-6L4 9l6 0z"/></svg>',
  enhance: '<svg viewBox="0 0 24 24"><path d="M12 3v6M9 6h6"/><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 13l4 3-4 3-4-3z"/></svg>',
  filter: '<svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>',
  export: '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
};

var LANGS = ["zh-CN", "zh-TW", "en", "ja", "ko", "de", "fr"];
var currentLang = "zh-CN";

function detectLang() {
  var nav = (navigator.language || "en").toLowerCase();
  if (nav.indexOf("zh") === 0) {
    if (nav.indexOf("tw") > -1 || nav.indexOf("hk") > -1) return "zh-TW";
    return "zh-CN";
  }
  for (var i = 0; i < LANGS.length; i++) {
    if (nav.indexOf(LANGS[i]) === 0) return LANGS[i];
  }
  return "en";
}

function applyLang(lang) {
  currentLang = lang;
  document.documentElement.lang = lang === "zh-CN" ? "zh-CN" : lang;
  var t = I18N[lang];

  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    var key = el.getAttribute("data-i18n");
    if (t[key] !== undefined) el.textContent = t[key];
  });

  var fg = document.getElementById("featGrid");
  fg.innerHTML = "";
  t.feats.forEach(function(f) {
    var div = document.createElement("div");
    div.className = "feat";
    div.innerHTML = '<div class="icon">' + ICONS[f.icon] + '</div><h3></h3><p></p>';
    div.querySelector("h3").textContent = f.title;
    div.querySelector("p").textContent = f.desc;
    fg.appendChild(div);
  });

  var fl = document.getElementById("faqList");
  fl.innerHTML = "";
  t.faqs.forEach(function(f) {
    var item = document.createElement("div");
    item.className = "faq-item";
    item.innerHTML = '<div class="faq-q" onclick="toggleFaq(this)"><span class="qtext"></span><span class="arrow">▼</span></div><div class="faq-a"><div class="faq-a-inner"></div></div>';
    item.querySelector(".qtext").textContent = f.q;
    item.querySelector(".faq-a-inner").innerHTML = f.a;
    fl.appendChild(item);
  });

  var sb = document.getElementById("subBlock");
  sb.innerHTML = "";
  t.subLines.forEach(function(line) {
    var p = document.createElement("p");
    p.innerHTML = line;
    sb.appendChild(p);
  });

  var lb = document.getElementById("langBar");
  lb.innerHTML = "";
  LANGS.forEach(function(l) {
    var b = document.createElement("button");
    b.className = "lang-btn" + (l === lang ? " active" : "");
    b.textContent = I18N[l].langName;
    b.onclick = function() { applyLang(l); };
    lb.appendChild(b);
  });

  document.title = "PawLume · " + t.heroTitle;
}

function toggleFaq(el) {
  el.parentElement.classList.toggle("open");
}

// init
applyLang(detectLang());
</script>
